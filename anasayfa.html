<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#222831"> <title>TR İzle - Canlı TV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="ana_stiller.css"> </head>
<body class="dark-mode">
    <header>
        <div class="container">
            <h1 class="logo">TR İzle</h1>
            <nav>
                <div class="user-auth">
                    <span id="welcomeMessage" class="hidden">Hoş geldin, <span id="userName"></span>!</span>
                    <button id="loginBtn" class="auth-btn">Giriş Yap / Kayıt Ol</button>
                    <button id="logoutBtn" class="auth-btn hidden">Çıkış Yap</button>
                </div>
                <button id="themeToggleBtn" class="theme-toggle-btn"><i class="fas fa-sun"></i></button>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="search-and-filter">
            <input type="text" id="searchInput" placeholder="Kanal ara...">
            <div id="categoryNav" class="category-nav">
                </div>
            <div id="sortOptions" class="sort-options">
                <button class="sort-btn active" data-sort="popular-desc"><i class="fas fa-fire"></i> Popüler</button>
                <button class="sort-btn" data-sort="name-asc"><i class="fas fa-sort-alpha-down"></i> A-Z</button>
                <button class="sort-btn" data-sort="name-desc"><i class="fas fa-sort-alpha-up"></i> Z-A</button>
            </div>
        </section>

        <section id="favoritesSection" class="favorites-section hidden">
            <h2>Favori Kanallarım</h2>
            <div id="favoriteChannelList" class="channel-grid">
                </div>
        </section>

        <section class="all-channels-section">
            <h2>Tüm Kanallar</h2>
            <div id="channelList" class="channel-grid">
                </div>
        </section>
    </main>

    <div id="authModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h3 id="modalTitle">Giriş Yap</h3>
            
            <form id="authForm">
                <div class="input-group">
                    <label for="authEmail">E-posta:</label>
                    <input type="email" id="authEmail" required>
                </div>
                <div class="input-group">
                    <label for="authPassword">Şifre:</label>
                    <input type="password" id="authPassword" required>
                </div>
                
                <button type="submit" id="authSubmitBtn" class="submit-btn">Giriş Yap</button>
            </form>
            
            <div class="switch-text">
                Hesabın yok mu? <a href="#" id="switchToRegister">Kayıt Ol</a>
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <button id="scrollTopBtn" class="scroll-top-btn"><i class="fas fa-arrow-up"></i></button>

    <script src="uygulama.js"></script> </body>
</html>
